# Curated exercise library. Every record is an ExerciseDefinition from @ferrum/domain.
#
# LOAD ENTRY CONVENTIONS (one convention, applied everywhere, no per-record guessing):
#   barbell               -> loadEntryMode: total. The number is the whole loaded bar,
#                            bar included. This matches how the imported history was
#                            entered (Bench Press (Barbell) 60/65/70 kg is a total).
#   dumbbell / kettlebell -> loadEntryMode: per_hand. The number is what is stamped on
#                            ONE implement, including single-arm work, where only one
#                            hand is loaded. A dumbbell held with both hands (goblet
#                            squat, overhead triceps extension) is a single implement
#                            and is therefore total.
#   plate-loaded machine  -> loadEntryMode: per_side when the machine has a symmetric
#                            pair of loading horns, total when it loads one sleeve
#                            (T Bar Row). loadSemantics stays `external`: those are
#                            real kilograms, only distributed differently.
#   selectorized stack    -> loadSemantics: machine_stack, loadEntryMode: total. A stack
#                            marking is a machine-specific number, not kilograms at the
#                            hands, so it is never comparable across machines.
#   two-stack cable       -> loadEntryMode: per_side (cable crossover / seated chest fly:
#                            each side is set independently on its own stack).
#   bodyweight-based      -> loadEntryMode: added_only. Only the added plate/belt load is
#                            recorded; the bodyweight part comes from the bodyweight
#                            snapshot times bodyweightFraction.
#   assisted machine      -> loadSemantics: bodyweight_minus_assistance, loadEntryMode:
#                            total (the assistance stack marking, subtracted at analysis).
#
# BODYWEIGHT FRACTIONS (share of bodyweight the trainee actually moves):
#   pull up / chin up / dip / assisted pull up : 1.00 (whole body hangs)
#   push up                                    : 0.64  Ebben, Wurm, VanderZanden et al.,
#                                                "Kinetic analysis of several variations
#                                                of push-ups", J Strength Cond Res 25(10)
#                                                2011: a standard push-up from the toes
#                                                supports ~64% of bodyweight at the hands.
#   inverted row                               : 0.60 (torso-angle dependent, mid estimate)
#   back extension                             : 0.45 (trunk + head + arms segment mass)
#   everything non-bodyweight                  : 0
#
# LATERALITY / REP COUNTING:
#   one limb at a time, set finished before switching -> unilateral_isolated + repCountMode
#   total (reps of the set you just did, not the round trip). Left/right alternating inside
#   one set -> unilateral_alternating + alternating_total.
#
# Fixture note: "Shoulder Lateral Raise" in the imported history carries 20-35 kg for 15
# reps, which rules out per-hand dumbbells for this trainee; it is an alias of the machine
# lateral raise, where those numbers are stack markings.

