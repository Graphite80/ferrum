plugins {
    id 'com.android.application'
}

// Mirrors apps/pwa/public/manifest.webmanifest. The two must agree: Chrome verifies the
// web manifest it fetches at run time against what the TWA declares, and a mismatched
// theme colour shows up as a flash of the wrong colour behind the splash screen.
def twaManifest = [
    applicationId: 'com.ferrum.app',
    hostName: 'ferrum.life-as-code.com',
    launchUrl: '/',
    name: 'Ferrum',
    launcherName: 'Ferrum',
    themeColor: '#101317',
    backgroundColor: '#101317',
    webManifestUrl: 'https://ferrum.life-as-code.com/manifest.webmanifest',
    splashScreenFadeOutDuration: 300,
    // 'customtabs' rather than 'webview': the offline log lives in IndexedDB, and a
    // WebView fallback would open the app against a different storage partition —
    // a lifter would find an empty history and nowhere to get it back from.
    fallbackType: 'customtabs',
    orientation: 'portrait',
]

// Notification delegation is deliberately absent. Nothing in the PWA calls the
// Notification API, so enabling it would declare POST_NOTIFICATIONS, export a service
// any app on the device could bind to, and prompt the lifter on first launch for a
// capability that does not exist. Add it back in the same change that first posts a
// notification, not before.

android {
    compileSdkVersion 36
    namespace twaManifest.applicationId

    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_FILE")) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS") ?: "android"
                keyPassword System.getenv("KEY_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId twaManifest.applicationId
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 1
        versionName "1.0.0"

        resValue "string", "appName", twaManifest.name
        resValue "string", "launcherName", twaManifest.launcherName
        resValue "string", "launchUrl", "https://" + twaManifest.hostName + twaManifest.launchUrl
        resValue "string", "webManifestUrl", twaManifest.webManifestUrl
        resValue "string", "hostName", twaManifest.hostName

        resValue "color", "colorPrimary", twaManifest.themeColor
        resValue "color", "colorPrimaryDark", twaManifest.themeColor
        resValue "color", "navigationColor", twaManifest.themeColor
        resValue "color", "navigationColorDark", twaManifest.themeColor
        resValue "color", "navigationDividerColor", twaManifest.themeColor
        resValue "color", "navigationDividerColorDark", twaManifest.themeColor
        resValue "color", "backgroundColor", twaManifest.backgroundColor

        resValue "string", "providerAuthority", twaManifest.applicationId + '.fileprovider'
        resValue "integer", "splashScreenFadeOutDuration", twaManifest.splashScreenFadeOutDuration.toString()
        resValue "string", "fallbackType", twaManifest.fallbackType
        resValue "string", "orientation", twaManifest.orientation
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
}
