plugins {
    id 'com.android.application'
}

// Mirrors apps/pwa/public/manifest.webmanifest. The two must agree: Chrome verifies the
// web manifest it fetches at run time against what the TWA declares, and a mismatched
// theme colour shows up as a flash of the wrong colour behind the splash screen.
def twaManifest = [
    applicationId: 'com.ferrum.app',
    hostName: 'ferrum.life-as-code.com',
    launchUrl: '/',
    name: 'Ferrum',
    launcherName: 'Ferrum',
    themeColor: '#101317',
    backgroundColor: '#101317',
    webManifestUrl: 'https://ferrum.life-as-code.com/manifest.webmanifest',
    // The rest timer is the one thing that must survive the app being backgrounded,
    // and a notification is how the browser surfaces it. Delegation lets Chrome post
    // it under this app's identity instead of its own.
    enableNotifications: true,
    shortcuts: [],
    splashScreenFadeOutDuration: 300,
    // 'customtabs' rather than 'webview': the offline log lives in IndexedDB, and a
    // WebView fallback would open the app against a different storage partition —
    // a lifter would find an empty history and nowhere to get it back from.
    fallbackType: 'customtabs',
    enableSiteSettingsShortcut: 'true',
    orientation: 'portrait',
]

android {
    compileSdkVersion 36
    namespace twaManifest.applicationId

    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_FILE")) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS") ?: "android"
                keyPassword System.getenv("KEY_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId twaManifest.applicationId
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 1
        versionName "1.0.0"

        resValue "string", "appName", twaManifest.name
        resValue "string", "launcherName", twaManifest.launcherName
        resValue "string", "launchUrl", "https://" + twaManifest.hostName + twaManifest.launchUrl
        resValue "string", "webManifestUrl", twaManifest.webManifestUrl
        resValue "string", "hostName", twaManifest.hostName

        resValue "color", "colorPrimary", twaManifest.themeColor
        resValue "color", "colorPrimaryDark", twaManifest.themeColor
        resValue "color", "navigationColor", twaManifest.themeColor
        resValue "color", "navigationColorDark", twaManifest.themeColor
        resValue "color", "navigationDividerColor", twaManifest.themeColor
        resValue "color", "navigationDividerColorDark", twaManifest.themeColor
        resValue "color", "backgroundColor", twaManifest.backgroundColor

        resValue "string", "providerAuthority", twaManifest.applicationId + '.fileprovider'
        resValue "bool", "enableNotification", twaManifest.enableNotifications.toString()
        resValue "integer", "splashScreenFadeOutDuration", twaManifest.splashScreenFadeOutDuration.toString()
        resValue "string", "fallbackType", twaManifest.fallbackType
        resValue "bool", "enableSiteSettingsShortcut", twaManifest.enableSiteSettingsShortcut
        resValue "string", "orientation", twaManifest.orientation

        twaManifest.shortcuts.eachWithIndex { shortcut, index ->
            resValue "string", "shortcut_name_$index", "$shortcut.name"
            resValue "string", "shortcut_short_name_$index", "$shortcut.short_name"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

task generateShortcutsFile {
    assert twaManifest.shortcuts.size() < 5, "You can have at most 4 shortcuts."
    twaManifest.shortcuts.eachWithIndex { s, i ->
        assert s.name != null, 'Missing `name` in shortcut #' + i
        assert s.short_name != null, 'Missing `short_name` in shortcut #' + i
        assert s.url != null, 'Missing `url` in shortcut #' + i
        assert s.icon != null, 'Missing `icon` in shortcut #' + i
    }

    def shortcutsFile = new File("$projectDir/src/main/res/xml", "shortcuts.xml")

    def xmlWriter = new StringWriter()
    def xmlMarkup = new groovy.xml.MarkupBuilder(new IndentPrinter(xmlWriter, "    ", true))

    xmlMarkup
        .'shortcuts'('xmlns:android': 'http://schemas.android.com/apk/res/android') {
            twaManifest.shortcuts.eachWithIndex { s, i ->
                'shortcut'(
                        'android:shortcutId': 'shortcut' + i,
                        'android:enabled': 'true',
                        'android:icon': '@drawable/' + s.icon,
                        'android:shortcutShortLabel': '@string/shortcut_short_name_' + i,
                        'android:shortcutLongLabel': '@string/shortcut_name_' + i) {
                    'intent'(
                            'android:action': 'android.intent.action.MAIN',
                            'android:targetPackage': twaManifest.applicationId,
                            'android:targetClass': twaManifest.applicationId + '.LauncherActivity',
                            'android:data': s.url)
                    'categories'('android:name': 'android.intent.category.LAUNCHER')
                }
            }
        }
    shortcutsFile.text = xmlWriter.toString() + '\n'
}

preBuild.dependsOn(generateShortcutsFile)

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
}
